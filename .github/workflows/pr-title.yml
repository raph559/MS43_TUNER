name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title format
        shell: python
        run: |
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              title = json.load(event_file)["pull_request"]["title"]

          pattern = r"(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)\([a-z0-9]+(?:-[a-z0-9]+)*\)!?: \S(?:[^\r\n]*\S)?"
          if len(title.splitlines()) != 1 or re.fullmatch(pattern, title) is None:
              print("::error title=Invalid PR title::Use type(scope): summary, for example fix(protocol): reject a stale revision. Types: feat, fix, refactor, perf, test, docs, build, ci, chore, revert. Use a lowercase scope with letters, digits or hyphens.")
              raise SystemExit(1)

          print("PR title matches type(scope): summary.")
