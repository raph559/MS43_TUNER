name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    # Without testdata/local the headless app tests take about a minute; with it, about seven.
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MS43Logger.sln

      - name: Build
        run: dotnet build MS43Logger.sln -c Release --no-restore

      # testdata/local (the owner's bins and XDF) is not in the repository: the core tests that need it
      # are skipped, and the UI tests that need it return early.
      - name: Test
        run: dotnet test MS43Logger.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
